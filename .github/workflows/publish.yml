name: Publish OCI image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix flake check
      - run: nix build .#oci -o collector-image.tar.gz
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Load and publish image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/chatgpt-markdown-collector
        run: |
          loaded=$(docker load < collector-image.tar.gz | awk '{print $3}')
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; else tag=latest; fi
          docker tag "$loaded" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
