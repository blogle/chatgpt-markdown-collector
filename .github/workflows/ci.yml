name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: bash scripts/check-boundaries.sh
      - run: bash scripts/test-isolated.sh
      - run: nix flake check
      - run: nix build .#collector .#upstream .#oci
