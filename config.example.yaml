auth:
  # Enabled by default. Uses the pinned exporter's readiness endpoint before export.
  preflight: true
  timeout_ms: 15000
  status_ttl_ms: 60000
exporter:
  # Defaults to chatgpt-exporter. The flake runtime puts the pinned binary on PATH.
  # Set false only for an exporter that requires --token instead of CHATGPT_TOKEN.
  supports_token_env: true
  concurrency: 3
  delay_ms: 250
  timeout_ms: 600000
token_env: CHATGPT_TOKEN
# Optional argv-list credential provider. Its trimmed stdout is used before token_env.
# Optional browser helper (install/run it separately with an explicit dedicated profile):
# token_command: ["chatgpt-local-auth", "token", "--profile", "/var/lib/chatgpt-local-auth"]
token_command_timeout_ms: 15000
state_dir: ./state
output_dir: ./output
projects:
  - id: project-id
    name: Project name
